name: check
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "**"
permissions:
    contents: read

# Pull requests supersede their own earlier runs; pushes to main are keyed by
# run_id so they always run to completion.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true
jobs:
    format:
        runs-on: ubuntu-latest
        name: format
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install the project
              run: uv sync --only-group check

            - name: Run format check
              run: uv run --no-sync ruff format --check

    lint:
        runs-on: ubuntu-latest
        name: lint
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install the project
              run: uv sync --only-group check

            - name: Run lint check
              run: uv run --no-sync ruff check

    spell:
        runs-on: ubuntu-latest
        name: spell
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install the project
              run: uv sync --only-group check

            - name: Run spell check
              run: uv run --no-sync codespell

    type:
        runs-on: ubuntu-latest
        name: type
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install the project
              run: uv sync --dev

            - name: Run type check
              run: uv run --no-sync ty check nats-core nats-server

    build:
        runs-on: ubuntu-latest
        name: build
        strategy:
            fail-fast: false
            matrix:
                package: [nats-py, nats-core, nats-server, nats-jetstream, nats-key-value]
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Build package
              run: uv build --package ${{ matrix.package }}
