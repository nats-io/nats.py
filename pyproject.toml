[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.0.0",
]
check = [
    "ty>=0.0.0a6",
    "ruff>=0.1.0",
    "codespell>=2.2.0",
    "nkeys>=0.1.0",
    "websockets>=16.0",
]
dev = [
    { include-group = "test" },
    { include-group = "check" },
]

[tool.uv]
required-version = ">=0.12.1"
workspace = { members = ["nats", "nats-server", "nats-core", "nats-jetstream", "nats-key-value"] }

[tool.uv.dependency-groups]
check = { requires-python = ">=3.13" }

[tool.ty.environment]
root = ["nats-core/src", "nats-server/src", "nats-jetstream/src", "nats-key-value/src"]

[tool.ty.src]
exclude = ["nats/"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B006"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"nats/examples/*" = ["E722", "F821", "F841", "I001", "W291"]
"nats/benchmark/*" = ["E722", "F403", "F405"]
"nats/tests/*" = ["F403", "F405", "F841", "E711", "E402", "I001", "E722", "F601", "E712", "F401"]
"nats/src/nats/micro/__init__.py" = ["F401"]
"nats/src/nats/nuid.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["nats/tests"]

[tool.codespell]
skip = ".git,*.lock,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff,*.woff2,*.ttf,*.eot,.venv,.venv-*,.mypy_cache,htmlcov,*.pyc"
ignore-words-list = "nats,nuid,ack,nak,hdr"
check-filenames = true
check-hidden = true
